<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澜沧江-湄公河 源头至入海口三维漫游</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        // 👉 替换成你在 Cesium Ion 获取的 Token
        Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6InFVUnd3QXU2NFBMTzhzMGYiLCJqdGkiOiI4N2ExYjkxOS1jODlmLTQzNjMtOGRkOS00MjkzNDE3ZDRjNzIiLCJpZCI6NTUyMDkwLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTUwMDkzMjN9.crDnPsRtQP_YNs__ujX5ugLVs3Bq3CSisclhtdG5tj0";

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain(),
            baseLayerPicker: true,
            geocoder: true,
            homeButton: true,
            sceneModePicker: true,
            navigationHelpButton: false,
            animation: false,
            timeline: false
        });
        viewer.scene.globe.enableLighting = true;

        const siteList = [
            { name: "源头｜吉富山 扎曲", lon: 94.85, lat: 33.78, lookHeight: 8000 },
            { name: "上游｜昌都峡谷段", lon: 97.18, lat: 31.14, lookHeight: 6000 },
            { name: "出山口｜横断山出口", lon: 99.40, lat: 28.20, lookHeight: 5000 },
            { name: "中下游｜西双版纳景洪段", lon: 100.80, lat: 22.00, lookHeight: 3500 },
            { name: "入海口｜湄公河三角洲", lon: 106.30, lat: 9.50, lookHeight: 4000 }
        ];

        siteList.forEach(site => {
            const pointEntity = viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(site.lon, site.lat, 0),
                point: {
                    pixelSize: 14,
                    color: Cesium.Color.RED,
                    outlineColor: Cesium.Color.WHITE,
                    outlineWidth: 2
                },
                label: {
                    text: site.name,
                    font: "15px sans-serif",
                    fillColor: Cesium.Color.WHITE,
                    background: Cesium.Color.BLACK.withAlpha(0.6),
                    showBackground: true,
                    pixelOffset: new Cesium.Cartesian2(0, -20)
                }
            });
            pointEntity.siteData = site;
        })

        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(function (clickEvent) {
            const pickResult = viewer.scene.pick(clickEvent.position);
            if (Cesium.defined(pickResult) && Cesium.defined(pickResult.id) && pickResult.id.siteData) {
                const s = pickResult.id.siteData;
                viewer.flyTo(pickResult.id, {
                    destination: Cesium.Cartesian3.fromDegrees(s.lon, s.lat, s.lookHeight),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(-35),
                        roll: 0
                    },
                    duration: 2.2
                })
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(100, 22, 1200000),
            orientation: {
                heading: 0,
                pitch: Cesium.Math.toRadians(-30),
                roll: 0
            },
            duration: 3
        })
    </script>
</body>
</html>
