<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>澜沧江‑湄公河三维漫游</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;}
        #control{position:absolute;top:12px;left:12px;z-index:99;padding:8px;background:rgba(0,0,0,0.65);color:#fff;border-radius:6px;}
        button{padding:4px 10px;margin:0 4px;cursor:pointer;}
    </style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="control">
    <button id="playBtn">开始沿河漫游</button>
    <button id="stopBtn">停止漫游</button>
</div>

<script>
Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6InFVUnd3QXU2NFBMTzhzMGYiLCJqdGkiOiI4N2ExYjkxOS1jODlmLTQzNjMtOGRkOS00MjkzNDE3ZDRjNzIiLCJpZCI6NTUyMDkwLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTUwMDkzMjN9.crDnPsRtQP_YNs__ujX5ugLVs3Bq3CSisclhtdG5tj0";

async function startApp(){
    const viewer = new Cesium.Viewer('cesiumContainer',{
        terrain:Cesium.Terrain.fromWorldTerrain({
            requestWaterMask:true,
            requestVertexNormals:true
        }),
        animation:false,
        timeline:false,
        baseLayerPicker:true
    });

    //初始镜头定位整条流域
    const basinExtent = Cesium.Rectangle.fromDegrees(92,9,108,35);
    viewer.camera.flyTo({
        destination:basinExtent,
        orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0},
        duration:1
    });

    //完整河线：扎阿曲源头 → 三江并流 → 西双版纳出境 → 泰国流域 → 越南入海口
    const riverCoords = [
        [94.72,33.82],   //①唐古拉山扎阿曲（源头）
        [98.82,28.42],   //②横断山区三江并流
        [100.14,22.72],  //③西双版纳河段（出境）
        [102.95,17.45],  //④泰国流域（老泰交界）
        [106.30,10.15]   //⑤越南湄公河入海口
    ];
    const riverPoints = riverCoords.map(ll=>Cesium.Cartesian3.fromDegrees(ll[0],ll[1]));

    viewer.entities.add({
        polyline:{
            positions:riverPoints,
            width:6,
            material:Cesium.Color.CORNFLOWERBLUE.withAlpha(0.85),
            clampToGround:true
        },
        name:"澜沧江‑湄公河干流"
    });

    //5个标记点位
    const points = [
        {name:"①唐古拉山扎阿曲（源头）",lon:94.72,lat:33.82,height:30000},
        {name:"②横断山区‑三江并流",lon:98.82,lat:28.42,height:24000},
        {name:"③西双版纳河段（出境）",lon:100.14,lat:22.72,height:20000},
        {name:"④泰国流域",lon:102.95,lat:17.45,height:22000},
        {name:"⑤越南湄公河入海口",lon:106.30,lat:10.15,height:26000}
    ];

    points.forEach(p=>{
        const entity = viewer.entities.add({
            position:Cesium.Cartesian3.fromDegrees(p.lon,p.lat),
            point:{pixelSize:12,color:Cesium.Color.RED},
            label:{text:p.name,font:"14px sans‑serif",pixelOffset:new Cesium.Cartesian2(0,-16)}
        });
        entity.flyHeight = p.height;
    });

    //点击标记镜头飞行跳转
    viewer.selectedEntityChanged.addEventListener(entity=>{
        if(!entity)return;
        viewer.camera.flyTo({
            destination:Cesium.Cartesian3.fromDegrees(
                Cesium.Cartographic.fromCartesian(entity.position.getValue()).longitude*180/Math.PI,
                Cesium.Cartographic.fromCartesian(entity.position.getValue()).latitude*180/Math.PI,
                entity.flyHeight
            ),
            orientation:{heading:0,pitch:Cesium.Math.toRadians(-35),roll:0},
            duration:2.2
        })
    });

    // 沿河自动漫游
    function startRiverFly(){
        let idx = 0;
        function next(){
            if(idx >= riverCoords.length) return;
            const [lon,lat] = riverCoords[idx];
            viewer.camera.flyTo({
                destination:Cesium.Cartesian3.fromDegrees(lon,lat,16000),
                orientation:{heading:0,pitch:Cesium.Math.toRadians(-42),roll:0},
                duration:2.2,
                complete:function(){
                    idx++;
                    next();
                }
            })
        }
        next();
    }
    function stopRiverFly(){
        viewer.camera.cancelFlight();
    }

    document.getElementById("playBtn").onclick = startRiverFly;
    document.getElementById("stopBtn").onclick = stopRiverFly;
}

startApp();
</script>
</body>
</html>
